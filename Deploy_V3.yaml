---
# The Password Safe API key must NOT live in this file. Create it once:
#
#   kubectl -n default create secret generic pws-api \
#     --from-literal=api-key='<NEW-KEY>;runas=NH-k8Example-local;'
#
# No namespace is declared on these objects on purpose - the pipeline passes
# -n explicitly, and a hardcoded namespace that disagrees with it makes
# kubectl reject the apply.
apiVersion: v1
kind: Service
metadata:
  name: passwordsafe-integrationv3
  labels:
    app: passwordsafe-integrationv3
spec:
  # NodePort costs nothing (no ELB). Reach it with:
  #   kubectl port-forward svc/passwordsafe-integrationv3 8080:80
  # Do NOT open 31220 on the node security group - this page renders the
  # retrieved secret in the browser, so a public NodePort publishes a
  # Password Safe credential to the internet.
  type: NodePort
  selector:
    app: passwordsafe-integrationv3
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31220
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passwordsafe-integrationv3
  labels:
    app: passwordsafe-integrationv3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passwordsafe-integrationv3
  template:
    metadata:
      labels:
        app: passwordsafe-integrationv3
      # The demo/assets-revision annotation is gone. The pipeline now runs
      # `kubectl rollout restart` after every apply, so pods pick up ConfigMap
      # changes without anyone remembering to bump a counter by hand.
    spec:
      volumes:
        - name: demo-assets
          configMap:
            name: cmv3
            defaultMode: 0555      # read+execute; 0777 on a script is never needed
        - name: secrets
          emptyDir:
            medium: Memory         # keep retrieved secrets off the node's disk

      initContainers:
        - name: secrets-agent
          # :latest + Always pulls Docker Hub on every pod start. EKS nodes
          # share a NAT egress IP, so anonymous pull rate limits can cause
          # ImagePullBackOff. Mirror to ECR and pin a digest for anything
          # beyond a demo.
          image: beyondtrust/secrets-agent:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: secrets
              mountPath: /usr/src/app/k8s
          env:
            - name: SECRETS_PATH
              value: "/usr/src/app/k8s"
            - name: BT_API_URL
              value: "https://pf922288.ps.beyondtrustcloud.com/BeyondTrust/api/public/v3"
            - name: BT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pws-api
                  key: api-key
            - name: SECRETS_LIST
              value: "k8s/k8s"
            - name: MANAGED_ACCOUNTS_LIST
              value: "masterk8s/paul"
            - name: BT_VERIFY_CA
              value: "True"        # set False only against a lab cert
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }

      containers:
        - name: web
          image: nginx:1.27
          command: ["/bin/sh", "/etc/pwsdemo/start.sh"]
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: secrets
              mountPath: /usr/src/app/k8s
              readOnly: true
            - name: demo-assets
              mountPath: /etc/pwsdemo
              readOnly: true
          readinessProbe:
            # Only goes green once secrets-agent actually retrieved the secret,
            # so a Password Safe auth failure fails the pipeline rather than
            # shipping a broken page.
            httpGet: { path: /k8s/k8s/k8s.txt, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
